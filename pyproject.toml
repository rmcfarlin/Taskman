[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taskman-vault"
dynamic = ["version"]
description = "A keyboard-first task and notes manager for your Markdown folders"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["textual>=8.2.8,<9", "rich>=14.2,<16"]
keywords = ["tasks", "notes", "markdown", "terminal", "tui", "productivity"]
classifiers = [
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Scheduling",
]

[project.urls]
Repository = "https://github.com/rmcfarlin/Taskman"
Issues = "https://github.com/rmcfarlin/Taskman/issues"
Changelog = "https://github.com/rmcfarlin/Taskman/releases"

[project.scripts]
taskman = "tui.__main__:main"

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]
build = ["build>=1.2,<2", "pyinstaller>=6.15,<7"]

[tool.setuptools]
packages = ["tui"]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "tui.__version__"}
